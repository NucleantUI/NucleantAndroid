org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Swift side (see app/build.gradle.kts). Each can also be passed as -P<name>=...
#   swift.abis=x86_64,arm64-v8a      ABIs to cross-compile and package
#   swift.config=debug               SwiftPM configuration
#   swift.sdk=swift-6.3.3-RELEASE_android   Swift SDK bundle (default: newest *_android installed)
#   swift.path=/path/to/swift        toolchain (default: the one matching the SDK's version)
#   swift.build=false                skip Swift: compile Java/Kotlin against the last jextract output only
